server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Serves the built React app; falls back to index.html for any route
    # so client-side routing (React Router) survives a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No /api/ proxy here on purpose: the backend runs on the host, not in
    # a container, and frontend/global.js already points the browser
    # straight at http://localhost:5000/api. Requests never route through
    # this nginx - it only ever serves static files.
}
